    </clipPath>
    <linearGradient id="spectrum" gradientUnits="userSpaceOnUse" x1="6" y1="24" x2="26" y2="19">
      <stop offset="0" stop-color="#ff4d6d"/>
      <stop offset="0.2" stop-color="#ff9a3c"/>
      <stop offset="0.4" stop-color="#ffd93d"/>
      <stop offset="0.6" stop-color="#4cd964"/>
      <stop offset="0.8" stop-color="#34a0ff"/>
      <stop offset="1" stop-color="#a06cff"/>
